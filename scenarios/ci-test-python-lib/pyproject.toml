[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-test-python-lib"
description = "hyperi-ci E2E fixture: Python library, container auto-skip"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
authors = [{ name = "HYPERI PTY LIMITED" }]
dynamic = ["version"]

# scalo is hyperi-pylib's archived successor (hyperi-pylib pulled from
# PyPI 2026-08-03) and the standard logger/config runtime across DFE
# Python projects. This test lib depends on it to verify the dep
# resolves cleanly, imports without bloat, and the publish path
# exercises the same install-time wiring real consumer projects do.
dependencies = [
    # No extra needed: scalo guards its eager psutil import (unlike the
    # old hyperi-pylib[metrics] requirement), so the base install is enough.
    # Pinned below 2.30.1, which raised scalo's own floor to Python >=3.14
    # and would break this fixture's requires-python >=3.12.
    "scalo>=2.30.0",
]

[project.urls]
Repository = "https://github.com/hyperi-io/ci-test-python-lib"

[tool.hatch.version]
path = "src/ci_test_python_lib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_test_python_lib"]

[dependency-groups]
# Quality tools picked up by `uv run` automatically. hyperi-ci's
# python quality handler invokes `ruff` directly; without it being
# in the project's venv, CI fails with "Failed to spawn: ruff".
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a0",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
