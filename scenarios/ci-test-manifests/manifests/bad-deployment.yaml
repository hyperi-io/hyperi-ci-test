# PLANTED NEGATIVE CASE - do not fix. replicas must be an integer;
# "three" is a string, so kubeconform rejects this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-web
  labels:
    app.kubernetes.io/name: bad-web
spec:
  replicas: "three"
  selector:
    matchLabels:
      app.kubernetes.io/name: bad-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad-web
    spec:
      containers:
        - name: web
          image: "python:3.12-slim"
          ports:
            - containerPort: 80
