[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-test-manifests"
description = "hyperi-ci E2E fixture: container, Kubernetes and IaC linting"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
authors = [{ name = "HYPERI PTY LIMITED" }]
dynamic = ["version"]

# No runtime dependencies - the app is stdlib-only and unlinked from scalo
# or any HyperI library on purpose.

[project.scripts]
ci-test-manifests = "ci_test_manifests.main:main"

[project.urls]
Repository = "https://github.com/hyperi-io/ci-test-manifests"

[tool.hatch.version]
path = "src/ci_test_manifests/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_test_manifests"]

[dependency-groups]
# Quality tools picked up by `uv run` automatically. hyperi-ci's python
# quality handler invokes `ruff` directly; without it in the project's
# venv, CI fails with "Failed to spawn: ruff".
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
