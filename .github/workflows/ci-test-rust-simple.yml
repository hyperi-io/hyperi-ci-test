name: ci-test-rust-simple

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-rust-simple/**"
      - ".github/workflows/ci-test-rust-simple.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-rust-simple/**"
      - ".github/workflows/ci-test-rust-simple.yml"
  workflow_dispatch:
    inputs:
      runner-mode:
        type: string
        required: false
        default: ""
        description: "self-hosted runs on the ARC runners. Empty runs on free GitHub runners."
      runner:
        type: string
        required: false
        default: ""
        description: "Runner for every x64 job, plan and release tail included. The runner-image canary passes its canary scale set."
      runner-build:
        type: string
        required: false
        default: ""
        description: "amd64 build runner, to tell a canary-image break from a hyperi-ci break. Overrides runner for the build."
      optimize-tier:
        type: string
        required: false
        default: ""
        description: "'release' to build the release optimisation tier (PGO + BOLT) on a run that publishes nothing."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      project-dir: scenarios/ci-test-rust-simple
      runner-mode: ${{ inputs.runner-mode || '' }}
      runner-quality: ${{ inputs.runner || '' }}
      runner-test: ${{ inputs.runner || '' }}
      runner-default: ${{ inputs.runner || '' }}
      runner-build: ${{ inputs.runner-build || inputs.runner || '' }}
      optimize-tier: ${{ inputs.optimize-tier || '' }}
    secrets: inherit
