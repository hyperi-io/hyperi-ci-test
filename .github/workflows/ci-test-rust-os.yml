# One caller per scenario: the path filter runs only the scenarios a change
# touches, and each scenario gets its own concurrency group.
name: ci-test-rust-os

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-rust-os/**"
      - ".github/workflows/ci-test-rust-os.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-rust-os/**"
      - ".github/workflows/ci-test-rust-os.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    # The scenario dir carries the binary's name, which the container stage
    # and the release names are read from.
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      project-dir: scenarios/ci-test-rust-os
    secrets: inherit
