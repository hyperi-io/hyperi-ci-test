# One caller per scenario: the path filter runs only the scenarios a change
# touches, and each scenario gets its own concurrency group.
name: ci-test-rust-os

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-rust-os/**"
      - ".github/workflows/ci-test-rust-os.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-rust-os/**"
      - ".github/workflows/ci-test-rust-os.yml"
  workflow_dispatch:
    inputs:
      runner-mode:
        type: string
        required: false
        default: ""
        description: "self-hosted runs on the ARC runners. Empty runs on free GitHub runners."
      runner:
        type: string
        required: false
        default: ""
        description: "Runner for the quality, test and build jobs. The runner-image canary passes its canary scale set."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    # The scenario dir carries the binary's name, which the container stage
    # and the release names are read from.
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      project-dir: scenarios/ci-test-rust-os
      runner-mode: ${{ inputs.runner-mode || '' }}
      runner-quality: ${{ inputs.runner || '' }}
      runner-test: ${{ inputs.runner || '' }}
      runner-build: ${{ inputs.runner || '' }}
    secrets: inherit
