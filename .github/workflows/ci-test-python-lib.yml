name: ci-test-python-lib

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-python-lib/**"
      - ".github/workflows/ci-test-python-lib.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-python-lib/**"
      - ".github/workflows/ci-test-python-lib.yml"
  workflow_dispatch:
    inputs:
      runner-mode:
        type: string
        required: false
        default: ""
        description: "self-hosted runs on the ARC runners. Empty runs on free GitHub runners."
      runner:
        type: string
        required: false
        default: ""
        description: "Runner for every x64 job, plan and release tail included. The runner-image canary passes its canary scale set."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/python-ci.yml@main
    with:
      project-dir: scenarios/ci-test-python-lib
      runner-mode: ${{ inputs.runner-mode || '' }}
      runner-quality: ${{ inputs.runner || '' }}
      runner-test: ${{ inputs.runner || '' }}
      runner-default: ${{ inputs.runner || '' }}
      runner-build: ${{ inputs.runner || '' }}
    secrets: inherit
