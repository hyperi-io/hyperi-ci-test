name: ci-test-rust-workspace

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-rust-workspace/**"
      - ".github/workflows/ci-test-rust-workspace.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-rust-workspace/**"
      - ".github/workflows/ci-test-rust-workspace.yml"
  workflow_dispatch:
    inputs:
      runner-mode:
        type: string
        required: false
        default: ""
        description: "self-hosted runs on the ARC runners. Empty runs on free GitHub runners."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      project-dir: scenarios/ci-test-rust-workspace
      runner-mode: ${{ inputs.runner-mode || '' }}
    secrets: inherit
