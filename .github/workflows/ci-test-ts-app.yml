name: ci-test-ts-app

"on":
  push:
    branches: ["**"]
    paths:
      - "scenarios/ci-test-ts-app/**"
      - ".github/workflows/ci-test-ts-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "scenarios/ci-test-ts-app/**"
      - ".github/workflows/ci-test-ts-app.yml"
  workflow_dispatch:
    inputs:
      runner-mode:
        type: string
        required: false
        default: ""
        description: "self-hosted runs on the ARC runners. Empty runs on free GitHub runners."
      runner:
        type: string
        required: false
        default: ""
        description: "Runner for every x64 job, plan and release tail included. The runner-image canary passes its canary scale set."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/ts-ci.yml@fix/diagram-check-merrow
    with:
      project-dir: scenarios/ci-test-ts-app
      # A PR pushes branch-* tags, pruned by ghcr-prune.yml.
      branch-build: "true"
      runner-mode: ${{ inputs.runner-mode || '' }}
      runner-quality: ${{ inputs.runner || '' }}
      runner-test: ${{ inputs.runner || '' }}
      runner-default: ${{ inputs.runner || '' }}
      runner-build: ${{ inputs.runner || '' }}
    secrets: inherit
